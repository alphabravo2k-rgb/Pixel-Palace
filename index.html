<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <meta http-equiv="Content-Security-Policy" content="
      default-src * data: blob: 'unsafe-inline' 'unsafe-eval'; 
      script-src * data: blob: 'unsafe-inline' 'unsafe-eval'; 
      connect-src * data: blob: 'unsafe-inline' wss: https:; 
      img-src * data: blob: 'unsafe-inline'; 
      style-src * data: blob: 'unsafe-inline'; 
      font-src * data: blob: 'unsafe-inline';
    " />
    
    <link rel="icon" href="https://raw.githubusercontent.com/alphabravo2k-rgb/pixel-palace-registration/1a7d90c43796fd037316bdaf4f3b4de9a485d615/image_4379f9.png" />
    <title>Pixel Palace | Tournament Command</title>
    
    <meta name="theme-color" content="#c026d3" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;600;700&family=Teko:wght@300..700&display=swap" rel="stylesheet" />

    <style>
      /* 🎨 CRITICAL: Define Brand Colors immediately for the Loader */
      :root {
        --color-brand: 192 38 211;       /* Fuchsia-600 */
        --color-brand-dim: 162 28 175;   /* Fuchsia-700 */
        --color-brand-glow: 232 121 249; /* Fuchsia-400 */
      }

      body { margin: 0; background-color: #050505; color: white; overflow: hidden; }
      
      .initial-loader {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100vh; width: 100vw; font-family: 'Rajdhani', sans-serif;
      }
      
      .spinner {
        width: 50px; height: 50px; 
        border: 3px solid rgba(192, 38, 211, 0.2);
        border-radius: 50%; 
        border-top-color: rgb(var(--color-brand));
        animation: spin 0.8s ease-in-out infinite; 
        margin-bottom: 24px;
        box-shadow: 0 0 15px rgba(192, 38, 211, 0.4);
      }
      
      @keyframes spin { to { transform: rotate(360deg); } }
      
      .status-text { 
        font-size: 0.9rem; 
        color: #71717a; 
        letter-spacing: 0.2em; 
        font-weight: 700;
        animation: pulse 2s infinite; 
      }
      
      @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
  </head>
  
  <body class="bg-bg text-gray-100 min-h-screen selection:bg-brand/30 selection:text-brand-glow">
    <div id="root">
      <div class="initial-loader">
        <div class="spinner"></div>
        <div class="status-text">ESTABLISHING UPLINK...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
