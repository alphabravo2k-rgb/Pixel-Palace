    <style>
      /* 🚀 SYSTEM BOOT LOADER */
      body { margin: 0; background-color: #050505; color: white; overflow: hidden; }
      
      .initial-loader {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at center, #121214 0%, #050505 100%);
        z-index: 9999;
      }

      .spinner-ring {
        width: 60px; height: 60px;
        border: 2px solid rgba(255, 255, 255, 0.05);
        border-top-color: #c026d3; /* Fallback Fuchsia */
        border-radius: 50%;
        animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: transform;
        box-shadow: 0 0 20px rgba(192, 38, 211, 0.2);
      }

      .status-text { 
        margin-top: 24px;
        font-family: 'Rajdhani', sans-serif; 
        font-size: 0.85rem; 
        color: #e879f9; 
        letter-spacing: 0.3em; 
        animation: pulse 2s infinite; 
        font-weight: 700;
        text-transform: uppercase;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
  </head>
  
  <body class="bg-bg text-gray-100 min-h-screen selection:bg-brand/30 selection:text-brand-glow antialiased">
    
    <noscript>
      <div style="padding: 2rem; color: #ef4444; font-family: monospace; text-align: center;">
        CRITICAL ERROR: JAVASCRIPT REQUIRED FOR NEURAL LINK.
      </div>
    </noscript>

    <div id="root">
      <div class="initial-loader">
        <div class="spinner-ring"></div>
        <div class="status-text">INITIALIZING NEXUS...</div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
