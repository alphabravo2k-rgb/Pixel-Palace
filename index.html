<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020202" />
    
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexus" />

    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self'; 
      script-src 'self' 'unsafe-inline' 'unsafe-eval'; 
      connect-src 'self' https://*.supabase.co wss://*.supabase.co; 
      img-src 'self' data: blob: https://*.supabase.co https://raw.githubusercontent.com https://images.unsplash.com; 
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
      font-src 'self' https://fonts.gstatic.com;
      media-src 'self' blob: data: https://*.supabase.co;
      worker-src 'self' blob:;
    " />
    
    <title>Pixel Palace | Nexus Platform</title>
    <meta name="description" content="The 25-Year Standard for Competitive Gaming Infrastructure." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@300..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <style>
      /* 🚀 SYSTEM BOOT SEQUENCE (MASTERED) */
      :root { --brand: #c026d3; }
      body { margin: 0; background-color: #020202; color: white; overflow: hidden; font-family: 'Rajdhani', sans-serif; }
      
      .initial-loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at center, #0a0a0a 0%, #020202 100%);
        z-index: 9999;
      }

      /* 📐 THE INDUSTRIAL SPINNER */
      .spinner-box { position: relative; width: 80px; height: 80px; }
      
      .spinner-ring {
        position: absolute; inset: 0;
        border: 2px solid rgba(255, 255, 255, 0.02);
        border-top-color: var(--brand);
        border-radius: 4px; /* Hard industrial edges for the 2050 aesthetic */
        animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        box-shadow: 0 0 30px rgba(192, 38, 211, 0.15);
      }

      .status-text { 
        margin-top: 32px;
        font-size: 0.7rem; 
        color: var(--brand); 
        letter-spacing: 0.5em; 
        animation: pulse 1.5s infinite; 
        font-weight: 700;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(192, 38, 211, 0.5);
      }

      /* 🎬 KINETIC KEYFRAMES */
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1); } }

      /* 📺 CRT SCANLINE OVERLAY */
      .initial-loader::before {
        content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(0deg, transparent 0%, rgba(192, 38, 211, 0.05) 50%, transparent 100%);
        background-size: 100% 4px;
        animation: scan 4s linear infinite;
        pointer-events: none;
      }

      @keyframes scan { from { background-position: 0 0; } to { background-position: 0 100%; } }
    </style>
  </head>
  
  <body class="antialiased selection:bg-fuchsia-500/30">
    
    <noscript>
      <div style="padding: 2rem; color: #ef4444; font-family: monospace; text-align: center; background: #000; height: 100vh; display: flex; align-items: center; justify-content: center;">
        CRITICAL ERROR: JAVASCRIPT KERNEL REQUIRED FOR NEXUS ACCESS.
      </div>
    </noscript>

    <div id="root">
      <div class="initial-loader">
        <div class="spinner-box">
          <div class="spinner-ring"></div>
        </div>
        <div class="status-text">Synchronizing Nexus...</div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
